
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>54-MAKTAB | Admin panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f4fa;color:#17233c}
header{background:#14294c;color:white;padding:22px;text-align:center}
main{max-width:650px;margin:30px auto;padding:15px}
.card{background:white;padding:22px;border-radius:15px;margin-bottom:18px;box-shadow:0 3px 14px #0001}
input,button{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #ccd4e2;font-size:16px}
button{background:#173e70;color:white;border:0;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h2>🏆 54-MAKTAB CLASS RATING 360</h2>
<p>ADMIN BOSHQARUV PANELI</p>
</header>
<main>
<div class="card" id="loginBox">
<h3>Admin tizimiga kirish</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Parol">
<button id="loginBtn">Kirish</button>
<p id="message"></p>
</div>
<div class="card hidden" id="dashboard">
<h3>Admin paneliga xuş kelibsiz!</h3>
<p id="userInfo"></p>
<button id="checkBtn">Mezonlarni tekshirish</button>
<div id="criteria"></div>
<button id="logoutBtn">Tizimdan chiqish</button>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
const loginBox=document.getElementById("loginBox");
const dashboard=document.getElementById("dashboard");
const message=document.getElementById("message");

async function showSession(){
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(session) await verifyAdmin(session.user);
}
async function verifyAdmin(user){
 const {data,error}=await supabaseClient
 .from("staff").select("role")
 .eq("id",user.id).maybeSingle();

 if(error || data?.role!=="admin"){
  await supabaseClient.auth.signOut();
  loginBox.classList.remove("hidden");
  dashboard.classList.add("hidden");
  message.textContent="Bu sahifaga faqat admin kira oladi.";
  return;
 }
 loginBox.classList.add("hidden");
 dashboard.classList.remove("hidden");
 document.getElementById("userInfo").textContent="Admin: "+user.email;
}
document.getElementById("loginBtn").onclick=async()=>{
 message.textContent="Tekshirilmoqda...";
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error){message.textContent="Login yoki parol xato.";return;}
 await verifyAdmin(data.user);
};
document.getElementById("checkBtn").onclick=async()=>{
 const area=document.getElementById("criteria");
 area.textContent="Yuklanmoqda...";
 const {data,error}=await supabaseClient.from("criteria").select("*");
 if(error){area.textContent="Xatolik: "+error.message;return;}
 area.innerHTML=data.map(x=>`<p>${x.name} — ${x.max_score} ball</p>`).join("");
};
document.getElementById("logoutBtn").onclick=async()=>{
 await supabaseClient.auth.signOut();
 location.reload();
};
showSession();
</script>
</body>
</html>
