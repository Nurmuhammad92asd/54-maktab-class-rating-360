<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>54-MAKTAB | Baholash kabineti</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #6366F1;
  --primary-hover: #4F46E5;
  --bg: #0F172A;
  --card-bg: rgba(30, 41, 59, 0.85);
  --text: #F8FAFC;
  --text-muted: #94A3B8;
  --border: rgba(255, 255, 255, 0.1);
  --success: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Outfit', 'Inter', sans-serif; 
  background: var(--bg); 
  color: var(--text); 
  line-height: 1.5; 
  min-height: 100vh;
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.1), transparent 40%);
  background-attachment: fixed;
}

header {
  background: linear-gradient(135deg, rgba(30, 27, 75, 0.95), rgba(79, 70, 229, 0.9));
  backdrop-filter: blur(10px);
  color: white; text-align: center; padding: 35px 20px;
  border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  animation: fadeUp 0.6s ease-out;
}
header h2 { font-size: 24px; font-weight: 800; margin-bottom: 5px; }
header p { font-size: 15px; opacity: 0.9; }

main { max-width: 700px; margin: -20px auto 40px; padding: 0 15px; position: relative; z-index: 10; }

.card {
  background: var(--card-bg); backdrop-filter: blur(16px);
  padding: 25px; border-radius: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3), inset 0 0 0 1px var(--border);
  border: 1px solid var(--border);
  animation: fadeUp 0.6s ease-out 0.1s forwards; opacity: 0;
}

h3 { font-size: 20px; margin-bottom: 20px; color: #A5B4FC; border-bottom: 2px solid rgba(99,102,241,0.2); padding-bottom: 10px; font-weight: 800; }

.label { font-weight: 700; margin-top: 15px; display: block; font-size: 14px; color: #E2E8F0; }
.hint { font-size: 13px; color: var(--text-muted); margin: 5px 0 15px; }

input, select, textarea {
  width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px;
  border: 2px solid rgba(99,102,241,0.2); font-size: 15px; font-family: inherit;
  background: rgba(15, 23, 42, 0.6); color: white; transition: all 0.3s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background: rgba(15, 23, 42, 0.9); box-shadow: 0 0 0 4px rgba(99,102,241,0.15); }
input::placeholder { color: #64748B; }

button {
  width: 100%; padding: 16px; margin: 15px 0 5px; border-radius: 12px;
  border: none; background: linear-gradient(90deg, #6366F1, #EC4899); color: white; font-size: 16px;
  font-weight: 800; cursor: pointer; transition: all 0.3s;
  box-shadow: 0 5px 15px rgba(236,72,153,0.3);
}
button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(236,72,153,0.4); }
button:active:not(:disabled) { transform: scale(0.98); }
button:disabled { background: #334155; color: #64748B; cursor: not-allowed; box-shadow: none; }

.criterion-block {
  background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 16px;
  padding: 20px; margin: 15px 0; transition: all 0.3s;
}
.criterion-block:hover { background: rgba(255,255,255,0.05); border-color: rgba(99,102,241,0.4); }

.criterion-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; gap: 10px; }
.criterion-name { font-weight: 800; color: #A5B4FC; font-size: 16px; }
.criterion-max { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; font-weight: 600;}

.info-btn {
  background: rgba(99,102,241,0.2); color: #A5B4FC; border: 1px solid rgba(99,102,241,0.3);
  padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
  cursor: pointer; width: auto; margin: 0; display: flex; align-items: center; gap: 4px;
  transition: all 0.3s; box-shadow: none; flex-shrink: 0;
}
.info-btn:hover { background: var(--primary); color: white; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(99,102,241,0.3); }

.existing {
  background: rgba(245, 158, 11, 0.15); border-left: 4px solid var(--warning);
  padding: 10px 12px; border-radius: 8px; font-size: 13px; margin: 10px 0; color: #FCD34D;
}

.success { background: rgba(16, 185, 129, 0.15); border-left: 4px solid var(--success); padding: 15px; border-radius: 10px; color: #6EE7B7; font-weight: 700; margin-top: 15px; animation: fadeUp 0.3s ease-out; }
.error { background: rgba(239, 68, 68, 0.15); border-left: 4px solid var(--danger); padding: 15px; border-radius: 10px; color: #FCA5A5; font-weight: 700; margin-top: 15px; animation: fadeUp 0.3s ease-out; }
.warning-box { background: rgba(245, 158, 11, 0.15); border-left: 4px solid var(--warning); padding: 15px; border-radius: 10px; color: #FCD34D; font-weight: 700; margin-top: 15px; font-size: 14px; }

.hidden { display: none !important; }
.logout-btn { background: rgba(255,255,255,0.05); color: #94A3B8; border: 1px solid var(--border); margin-top: 20px; box-shadow: none;}
.logout-btn:hover { background: rgba(239,68,68,0.1); color: #FCA5A5; border-color: rgba(239,68,68,0.3); box-shadow: none; transform: none;}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.6); }

/* Animatsiya */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* MODAL */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 23, 42, 0.8); display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  backdrop-filter: blur(8px);
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-content {
  background: #1E293B; border-radius: 24px; max-width: 550px; width: 100%;
  max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
  transform: scale(0.9) translateY(20px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  border: 1px solid rgba(255,255,255,0.1);
}
.modal-overlay.active .modal-content { transform: scale(1) translateY(0); }

.modal-header {
  padding: 20px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
  border-radius: 24px 24px 0 0; z-index: 2;
}
.modal-header h3 { margin: 0; font-size: 18px; color: white; border: none; padding: 0; }
.modal-close {
  background: rgba(255,255,255,0.1); border: none; width: 32px; height: 32px; border-radius: 50%;
  font-size: 18px; font-weight: bold; color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0; margin: 0;
  transition: all 0.3s; box-shadow: none;
}
.modal-close:hover { background: rgba(239,68,68,0.2); color: #FCA5A5; transform: rotate(90deg); box-shadow: none; }

.modal-body { padding: 25px; font-size: 14px; color: #CBD5E1; line-height: 1.6; }
.modal-body p { margin-bottom: 12px; }
.modal-body strong { color: #A5B4FC; display: block; margin-top: 15px; margin-bottom: 4px; }
.modal-body ul { padding-left: 20px; margin-bottom: 15px; }
.modal-body li { margin-bottom: 8px; }
.modal-body .score-range { font-weight: 800; color: white; background: rgba(99,102,241,0.3); padding: 2px 8px; border-radius: 6px; font-size: 13px; }

/* Hafta holatlari uchun ranglar */
.week-current { border-color: rgba(16, 185, 129, 0.5) !important; background: rgba(16, 185, 129, 0.1) !important; }
.week-past { opacity: 0.6; }
</style>
</head>
<body>

<header>
  <h2>🏆 54-MAKTAB CLASS RATING</h2>
  <p>Baholash va monitoring kabineti</p>
</header>

<main>
  <div class="card hidden" id="dashboard">
    <h3>Xush kelibsiz, <span id="staffName" style="color:#A5B4FC">...</span>!</h3>

    <div id="currentWeekBanner" class="warning-box" style="display:none; margin-bottom: 20px;">
      ⚠️ <b>Diqqat!</b> Siz faqat joriy haftani baholay olasiz. O'tgan haftalar faqat ko'rish uchun ochiq.
    </div>

    <label class="label">1. Sinfni tanlang</label>
    <select id="classSelect"><option value="">— Yuklanmoqda... —</option></select>

    <label class="label">2. Haftani tanlang</label>
    <select id="weekSelect"><option value="">— Yuklanmoqda... —</option></select>

    <label class="label" style="margin-top: 25px;">3. Baholash</label>
    <div class="hint" id="formHint">Sinf va haftani tanlang...</div>
    
    <div id="criteriaArea">
      <p class="hint" style="text-align:center; padding: 20px 0;">Sinf va haftani tanlang...</p>
    </div>

    <button id="saveBtn" disabled>Ma'lumotlarni saqlash</button>
    <div id="resultMsg"></div>

    <button id="logoutBtn" class="logout-btn">Tizimdan chiqish</button>
  </div>
</main>

<!-- MODAL OYNA -->
<div class="modal-overlay" id="infoModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Mezon haqida</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
const criteriaInfo = {
  "Tashabbuskorlik": `
    <p>Bu yerda o'quvchining darsda va darsdan tashqari vaqtda o'z fikrini aytishi, savol berishi, yangi g'oyalar taklif qilishi hisobga olinadi.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">9-10 ball:</span> Darslarda doim faol, mustaqil fikrlaydi, g'oyalar beradi, yetakchilik qiladi.</li>
      <li><span class="score-range">6-8 ball:</span> O'rtacha faollik, ba'zan savollar beradi, topshiriqlarni bajaradi.</li>
      <li><span class="score-range">3-5 ball:</span> Faqat so'ralganda javob beradi, passiv.</li>
      <li><span class="score-range">0-2 ball:</span> Darsda umuman qatnashmaydi, befarq.</li>
    </ul>
  `,
  "Maktab tadbirlaridagi faollik": `
    <p>Maktab miqyosidagi bayramlar, tanlovlar, sport musobaqalari va boshqa tadbirlarda qatnashish hisobga olinadi.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">9-10 ball:</span> Barcha tadbirlarda faol qatnashadi, tashkil qiladi, sovrin oladi.</li>
      <li><span class="score-range">6-8 ball:</span> Ko'pchilik tadbirlarda qatnashadi.</li>
      <li><span class="score-range">3-5 ball:</span> Faqat majburiy tadbirlarda qatnashadi.</li>
      <li><span class="score-range">0-2 ball:</span> Tadbirlarga umuman qatnashmaydi.</li>
    </ul>
  `,
  "Oquv natijalari": `
    <p>Bu yerda sinfning choraklik baholari, nazorat ishlari natijalari hisobga olinadi.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">22-25 ball:</span> O'zlashtirish eng yuqori (90-100%), hamma bahosi yaxshi.</li>
      <li><span class="score-range">16-21 ball:</span> Yaxshi o'zlashtirish, bir nechta past baholar bor.</li>
      <li><span class="score-range">8-15 ball:</span> O'rtacha o'zlashtirish, past baholovchilar ko'p.</li>
      <li><span class="score-range">0-7 ball:</span> O'zlashtirish juda past.</li>
    </ul>
  `,
  "Davomat": `
    <p>Darslarga qatnashish, sababsiz dars qoldirmaslik.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">18-20 ball:</span> Bitta ham sababsiz dars qoldirilmagan, kechikish yo'q.</li>
      <li><span class="score-range">13-17 ball:</span> 1-2 ta sababsiz dars qoldirilgan yoki kichik kechikishlar.</li>
      <li><span class="score-range">7-12 ball:</span> 3-5 ta sababsiz dars qoldirilgan.</li>
      <li><span class="score-range">0-6 ball:</span> Ko'plab dars qoldirishlar, davomat juda past.</li>
    </ul>
  `,
  "Tozalik va tartib": `
    <p>Sinf xonasining tozaligi, partalar va jihozlarning holati.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">9-10 ball:</span> Sinf xonasi doim toza, partalar tartibda.</li>
      <li><span class="score-range">6-8 ball:</span> Kichik kamchiliklar bor, umumiy holat yaxshi.</li>
      <li><span class="score-range">3-5 ball:</span> Sinf xonasi tartibsiz, chiqindilar bor.</li>
      <li><span class="score-range">0-2 ball:</span> Sinf juda iflos, partalar buzilgan.</li>
    </ul>
  `,
  "Intizom va xulq-atvor": `
    <p>O'quvchilarning dars vaqtidagi va tanaffusdagi o'zini tutishi.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">13-15 ball:</span> Intizom yaxshi, hurmatda, tartibbuzarlik yo'q.</li>
      <li><span class="score-range">9-12 ball:</span> Vaqti-vaqti bilan kichik tartibbuzarliklar bo'ladi.</li>
      <li><span class="score-range">5-8 ball:</span> Tez-tez tartibbuzarlik, e'tiborsizlik.</li>
      <li><span class="score-range">0-4 ball:</span> Doimiy tartibbuzarlik, janjallar.</li>
    </ul>
  `,
  "Kitobxonlik": `
    <p>Kutubxonadan kitob olish, o'qilgan kitoblar bo'yicha suhbatlar.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">9-10 ball:</span> Ko'pchilik kutubxonaga a'zo, har oyda kitob o'qiydi.</li>
      <li><span class="score-range">6-8 ball:</span> O'rtacha darajada kitob o'qishadi.</li>
      <li><span class="score-range">3-5 ball:</span> Juda kam o'quvchilar o'qiydi.</li>
      <li><span class="score-range">0-2 ball:</span> Kutubxonaga umuman qatnamaydi.</li>
    </ul>
  `
};

const dashboard  = document.getElementById("dashboard");
const classSelect= document.getElementById("classSelect");
const weekSelect = document.getElementById("weekSelect");
const criteriaArea = document.getElementById("criteriaArea");
const saveBtn    = document.getElementById("saveBtn");
const resultMsg  = document.getElementById("resultMsg");
const formHint   = document.getElementById("formHint");
const currentWeekBanner = document.getElementById("currentWeekBanner");

const modal = document.getElementById("infoModal");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");
const modalClose = document.getElementById("modalClose");

let currentStaffId = null;
let myCriteria = [];
let myScores = {};
let allWeeksData = [];
let currentWeekId = null;

modalClose.onclick = () => modal.classList.remove("active");
modal.onclick = (e) => { if (e.target === modal) modal.classList.remove("active"); };

function showCriteriaInfo(name) {
  const info = criteriaInfo[name] || "<p>Bu mezon haqida ma'lumot kiritilmagan.</p>";
  modalTitle.textContent = name;
  modalBody.innerHTML = info;
  modal.classList.add("active");
}

// ============ SESSION TEKSHIRISH ============
async function checkSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    window.location.href = "login.html"; 
    return;
  }
  await initDashboard(session.user);
}

// ============ DASHBOARD YUKLASH ============
async function initDashboard(user) {
  const { data: staff, error: staffErr } = await supabaseClient
    .from("staff").select("full_name").eq("id", user.id).maybeSingle();

  if (staffErr || !staff) {
    alert("Xodim ma'lumotlari topilmadi. Qaytadan kiring.");
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
    return;
  }

  currentStaffId = user.id;
  document.getElementById("staffName").textContent = staff.full_name;
  dashboard.classList.remove("hidden");

  const { data: sc, error: scErr } = await supabaseClient
    .from("staff_criteria")
    .select("criterion_id, criteria(id, name, max_score)")
    .eq("staff_id", user.id);

  if (scErr) {
    criteriaArea.innerHTML = `<div class="error">Mezonlarni yuklashda xato: ${scErr.message}</div>`;
    return;
  }
  myCriteria = (sc || []).map(x => x.criteria).filter(Boolean);

  if (myCriteria.length === 0) {
    criteriaArea.innerHTML = `<div class="error">Sizga hali baholash mezoni biriktirilmagan. Admin bilan bog'laning.</div>`;
    saveBtn.disabled = true;
    return;
  }

  const { data: classes } = await supabaseClient
    .from("classes").select("id, name").order("name");

  classSelect.innerHTML = '<option value="">— Sinfni tanlang —</option>' +
    (classes || []).map(c => `<option value="${c.id}">${c.name}</option>`).join("");

  // Barcha haftalarni olish
  const { data: weeks } = await supabaseClient
    .from("weeks").select("id, title, start_date, end_date")
    .order("start_date", { ascending: true });

  allWeeksData = weeks || [];
  
  // Bugungi sana
  const today = new Date().toISOString().split('T')[0];
  
  // Joriy haftani aniqlash
  let currentWeek = allWeeksData.find(w => today >= w.start_date && today <= w.end_date);
  if (currentWeek) currentWeekId = currentWeek.id;

  // Haftalarni chiqarish (o'tganlar ko'rinadi lekin disabled)
  weekSelect.innerHTML = '<option value="">— Haftani tanlang —</option>' +
    allWeeksData.map(w => {
      const isCurrent = (currentWeekId === w.id);
      const isPast = today > w.end_date;
      const isFuture = today < w.start_date;
      
      // Faqat joriy hafta tanlanishi mumkin, boshqalar disabled
      let status = "";
      let disabled = "";
      
      if (isCurrent) {
        status = "✅ Joriy hafta (Baholash mumkin)";
      } else if (isPast) {
        status = "🔒 O'tgan hafta (Faqat ko'rish)";
        disabled = "disabled";
      } else if (isFuture) {
        status = "⏳ Kelgusi hafta (Hali ochilmagan)";
        disabled = "disabled";
      }
      
      return `<option value="${w.id}" ${isCurrent ? 'selected' : ''} ${disabled}>
        ${w.title} (${w.start_date} — ${w.end_date}) ${status}
      </option>`;
    }).join("");

  if (currentWeekId) {
    currentWeekBanner.style.display = "block";
  }

  classSelect.onchange = loadEvaluationForm;
  weekSelect.onchange  = loadEvaluationForm;
  saveBtn.onclick = saveEvaluations;
  
  // Agar joriy hafta bo'lsa, avtomatik yuklash
  if (currentWeekId) {
    loadEvaluationForm();
  }
}

// ============ FORMANI YUKLASH ============
async function loadEvaluationForm() {
  resultMsg.innerHTML = "";
  const classId = classSelect.value;
  const weekId  = weekSelect.value;

  if (!classId || !weekId) {
    criteriaArea.innerHTML = `<p class="hint" style="text-align:center; padding:20px;">Sinf va haftani tanlang...</p>`;
    saveBtn.disabled = true;
    formHint.textContent = "Sinf va haftani tanlang...";
    return;
  }

  // Joriy hafta ekanligini tekshirish
  const isCurrentWeek = (parseInt(weekId) === currentWeekId);
  
  if (!isCurrentWeek) {
    formHint.textContent = "Bu hafta faol emas. Faqat joriy haftani baholash mumkin.";
    formHint.style.color = "#FCD34D";
  } else {
    formHint.textContent = "Joriy hafta uchun ball kiriting.";
    formHint.style.color = "var(--text-muted)";
  }

  criteriaArea.innerHTML = `<p class="hint" style="text-align:center; padding:20px;">Yuklanmoqda...</p>`;
  saveBtn.disabled = true;

  const { data: existing, error: eErr } = await supabaseClient
    .from("evaluations")
    .select("criterion_id, score, comment")
    .eq("staff_id", currentStaffId)
    .eq("class_id", classId)
    .eq("week_id", weekId);

  if (eErr) {
    criteriaArea.innerHTML = `<div class="error">Xato: ${eErr.message}</div>`;
    return;
  }

  myScores = {};
  (existing || []).forEach(e => {
    myScores[e.criterion_id] = { score: e.score, comment: e.comment || "" };
  });

  // Formani chizish
  criteriaArea.innerHTML = myCriteria.map(c => {
    const ex = myScores[c.id];
    const val = ex ? ex.score : "";
    const cmt = ex ? ex.comment : "";
    
    const hasInfo = criteriaInfo[c.name] !== undefined;
    const infoBtn = hasInfo 
      ? `<button class="info-btn" onclick="showCriteriaInfo('${c.name}')">ℹ️ To'liq ma'lumot</button>` 
      : '';

    // Agar joriy hafta bo'lmasa, inputlarni disabled qilamiz
    const disabledAttr = !isCurrentWeek ? "disabled" : "";

    return `
      <div class="criterion-block ${!isCurrentWeek ? 'week-past' : ''}">
        <div class="criterion-header">
          <div class="criterion-name">${c.name}</div>
          ${infoBtn}
        </div>
        <div class="criterion-max">Maksimal: ${c.max_score} ball</div>
        ${ex ? `<div class="existing">Kiritilgan: <b>${ex.score}</b> ball${ex.comment ? ' (Izoh: '+ex.comment+')' : ''}</div>` : ""}
        <input type="number" min="0" max="${c.max_score}" step="0.5"
               id="score_${c.id}" value="${val}" placeholder="0 dan ${c.max_score} gacha" ${disabledAttr}>
        <input type="text" id="comment_${c.id}" value="${cmt.replace(/"/g,'&quot;')}" placeholder="Izoh yozish (ixtiyoriy)" ${disabledAttr}>
      </div>
    `;
  }).join("");

  if (!isCurrentWeek) {
    criteriaArea.innerHTML += `<div class="error" style="margin-top:15px;">🔒 Bu hafta yopilgan. Siz faqat ko'rishingiz mumkin, o'zgartirish kiritib bo'lmaydi.</div>`;
    saveBtn.disabled = true;
  } else {
    saveBtn.disabled = false;
  }
}

// ============ SAQLASH ============
async function saveEvaluations() {
  const classId = classSelect.value;
  const weekId  = weekSelect.value;
  if (!classId || !weekId) return;

  // Joriy hafta ekanligini qayta tekshirish
  if (parseInt(weekId) !== currentWeekId) {
    resultMsg.innerHTML = `<div class="error">Faqat joriy haftani baholash mumkin!</div>`;
    return;
  }

  resultMsg.innerHTML = "";
  const rows = [];

  for (const c of myCriteria) {
    const input = document.getElementById("score_" + c.id);
    const comment = document.getElementById("comment_" + c.id);
    
    if (!input) continue; // Agar disabled bo'lsa, o'tkazib yuboramiz
    
    const raw = input.value.trim();
    if (raw === "") continue; 

    const val = parseFloat(raw);
    if (isNaN(val) || val < 0 || val > c.max_score) {
      resultMsg.innerHTML = `<div class="error">"${c.name}" uchun noto'g'ri ball kiritildi. 0 va ${c.max_score} orasida bo'lishi kerak.</div>`;
      return;
    }
    
    rows.push({
      class_id:     parseInt(classId),
      week_id:      parseInt(weekId),
      criterion_id: c.id,
      staff_id:     currentStaffId,
      score:        val,
      comment:      comment.value.trim() || null
    });
  }

  if (rows.length === 0) {
    resultMsg.innerHTML = `<div class="error">Saqlash uchun hech qanday ball kiritilmadi.</div>`;
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = "Saqlanmoqda...";

  const { error } = await supabaseClient
    .from("evaluations")
    .upsert(rows, { onConflict: "class_id,week_id,criterion_id,staff_id" });

  saveBtn.disabled = false;
  saveBtn.textContent = "Ma'lumotlarni saqlash";

  if (error) {
    resultMsg.innerHTML = `<div class="error">Xatolik yuz berdi: ${error.message}</div>`;
    return;
  }

  resultMsg.innerHTML = `<div class="success">✅ Muvaffaqiyatli saqlandi!</div>`;
  setTimeout(loadEvaluationForm, 1000);
}

document.getElementById("logoutBtn").onclick = async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "index.html";
};

checkSession();
