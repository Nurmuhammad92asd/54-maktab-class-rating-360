<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>54-MAKTAB | Xodim kabineti</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4fa;font-family:Arial;color:#17233c}
header{background:#14294c;color:white;text-align:center;padding:22px}
main{max-width:720px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:15px;margin-bottom:18px;box-shadow:0 3px 14px #0001}
input,select,textarea,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccd4e2;font-size:15px;font-family:inherit}
button{background:#173e70;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{background:#8a9bb8;cursor:not-allowed}
.hidden{display:none}
#message{color:#b42318}
.label{font-weight:bold;margin-top:14px;display:block;font-size:14px;color:#3a4a66}
.hint{font-size:13px;color:#68758c;margin:4px 0}
.criterion-block{background:#f8fafd;border:1px solid #e2e8f2;border-radius:10px;padding:14px;margin:12px 0}
.criterion-name{font-weight:bold;color:#173e70;margin-bottom:4px}
.criterion-max{font-size:13px;color:#68758c;margin-bottom:10px}
.score-row{display:flex;gap:10px;align-items:center}
.score-row input[type=number]{flex:1}
.existing{background:#fff8e1;border-left:4px solid #f0b429;padding:8px 12px;border-radius:6px;font-size:13px;margin:8px 0}
.success{background:#e8f5e9;border-left:4px solid #2e7d32;padding:10px 12px;border-radius:6px;color:#1b5e20;font-weight:bold}
.error{background:#ffebee;border-left:4px solid #c62828;padding:10px 12px;border-radius:6px;color:#b71c1c}
</style>
</head>
<body>
<header>
<h2>🏆 54-MAKTAB CLASS RATING 360</h2>
<p>XODIMLAR KABINETI</p>
</header>
<main>

<!-- LOGIN -->
<div class="card" id="loginBox">
<h3>Tizimga kirish</h3>
<input id="email" type="email" placeholder="Email manzilingiz">
<input id="password" type="password" placeholder="Parolingiz">
<button id="loginBtn">Kirish</button>
<p id="message"></p>
</div>

<!-- DASHBOARD -->
<div class="card hidden" id="dashboard">
<h3>Xush kelibsiz, <span id="staffName">...</span>!</h3>

<label class="label">1. Sinfni tanlang</label>
<select id="classSelect"><option value="">— Yuklanmoqda... —</option></select>

<label class="label">2. Haftani tanlang</label>
<select id="weekSelect"><option value="">— Yuklanmoqda... —</option></select>

<label class="label">3. Baholash</label>
<div class="hint">Har bir mezon uchun 0 dan maksimal ballgacha qiymat kiriting.</div>
<div id="criteriaArea"><p class="hint">Sinf va haftani tanlang...</p></div>

<button id="saveBtn" disabled>Saqlash</button>
<div id="resultMsg"></div>

<button id="logoutBtn" style="background:#8a9bb8;margin-top:14px">Chiqish</button>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
const loginBox   = document.getElementById("loginBox");
const dashboard  = document.getElementById("dashboard");
const message    = document.getElementById("message");
const classSelect= document.getElementById("classSelect");
const weekSelect = document.getElementById("weekSelect");
const criteriaArea = document.getElementById("criteriaArea");
const saveBtn    = document.getElementById("saveBtn");
const resultMsg  = document.getElementById("resultMsg");

let currentStaffId = null;
let myCriteria = [];   // [{id, name, max_score}]
let myScores = {};     // {criterion_id: score}

// ============ LOGIN ============
document.getElementById("loginBtn").onclick = async () => {
  message.textContent = "Tekshirilmoqda...";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { message.textContent = "Email yoki parol xato."; return; }
  message.textContent = "";
  await initDashboard(data.user);
};

document.getElementById("logoutBtn").onclick = async () => {
  await supabaseClient.auth.signOut();
  location.reload();
};

// ============ SESSION ============
async function checkSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) await initDashboard(session.user);
}

// ============ DASHBOARD INIT ============
async function initDashboard(user) {
  // 1. Staff ma'lumot
  const { data: staff, error: staffErr } = await supabaseClient
    .from("staff").select("full_name, role").eq("id", user.id).maybeSingle();

  if (staffErr || !staff) {
    await supabaseClient.auth.signOut();
    message.textContent = "Xodim ma'lumotlari topilmadi.";
    return;
  }
  if (staff.role === "admin") {
    await supabaseClient.auth.signOut();
    message.textContent = "Admin hisobidan admin panelga kiring.";
    return;
  }

  currentStaffId = user.id;
  document.getElementById("staffName").textContent = staff.full_name;
  loginBox.classList.add("hidden");
  dashboard.classList.remove("hidden");

  // 2. Mening mezonlarim (staff_criteria orqali)
  const { data: sc, error: scErr } = await supabaseClient
    .from("staff_criteria")
    .select("criterion_id, criteria(id, name, max_score)")
    .eq("staff_id", user.id);

  if (scErr) {
    criteriaArea.innerHTML = `<div class="error">Mezonlarni yuklashda xato: ${scErr.message}</div>`;
    return;
  }
  myCriteria = (sc || []).map(x => x.criteria).filter(Boolean);

  if (myCriteria.length === 0) {
    criteriaArea.innerHTML = `<div class="error">Sizga hali mezon biriktirilmagan. Admin bilan bog'laning.</div>`;
    saveBtn.disabled = true;
    return;
  }

  // 3. Sinflarni yuklash
  const { data: classes, error: clErr } = await supabaseClient
    .from("classes").select("id, name, level").order("name");
  if (clErr) { criteriaArea.innerHTML = `<div class="error">Sinflar xatosi: ${clErr.message}</div>`; return; }

  classSelect.innerHTML = '<option value="">— Sinfni tanlang —</option>' +
    (classes || []).map(c => `<option value="${c.id}">${c.name}</option>`).join("");

  // 4. Haftalarni yuklash (faqat open)
  const { data: weeks, error: wErr } = await supabaseClient
    .from("weeks").select("id, title, start_date, end_date")
    .eq("status", "open").order("start_date");
  if (wErr) { criteriaArea.innerHTML = `<div class="error">Haftalar xatosi: ${wErr.message}</div>`; return; }

  weekSelect.innerHTML = '<option value="">— Haftani tanlang —</option>' +
    (weeks || []).map(w => `<option value="${w.id}">${w.title} (${w.start_date} — ${w.end_date})</option>`).join("");

  // 5. Tanlash o'zgarganda formani yangilash
  classSelect.onchange = loadEvaluationForm;
  weekSelect.onchange  = loadEvaluationForm;
  saveBtn.onclick = saveEvaluations;
}

// ============ FORMANI YUKLASH ============
async function loadEvaluationForm() {
  resultMsg.innerHTML = "";
  const classId = classSelect.value;
  const weekId  = weekSelect.value;

  if (!classId || !weekId) {
    criteriaArea.innerHTML = `<p class="hint">Sinf va haftani tanlang...</p>`;
    saveBtn.disabled = true;
    return;
  }

  // Mavjud baholarni tekshirish (shu staff + class + week)
  const { data: existing, error: eErr } = await supabaseClient
    .from("evaluations")
    .select("criterion_id, score, comment")
    .eq("staff_id", currentStaffId)
    .eq("class_id", classId)
    .eq("week_id", weekId);

  if (eErr) {
    criteriaArea.innerHTML = `<div class="error">Xato: ${eErr.message}</div>`;
    saveBtn.disabled = true;
    return;
  }

  myScores = {};
  (existing || []).forEach(e => {
    myScores[e.criterion_id] = { score: e.score, comment: e.comment || "" };
  });

  // Formani ko'rsatish
  criteriaArea.innerHTML = myCriteria.map(c => {
    const ex = myScores[c.id];
    const val = ex ? ex.score : "";
    const cmt = ex ? ex.comment : "";
    return `
      <div class="criterion-block">
        <div class="criterion-name">${c.name}</div>
        <div class="criterion-max">Maksimal: ${c.max_score} ball</div>
        ${ex ? `<div class="existing">Oldin kiritilgan: <b>${ex.score}</b> ball${ex.comment ? ' — izoh: '+ex.comment : ''}. Yangilashingiz mumkin.</div>` : ""}
        <div class="score-row">
          <input type="number" min="0" max="${c.max_score}" step="0.5"
                 id="score_${c.id}" value="${val}" placeholder="0 — ${c.max_score}">
        </div>
        <input type="text" id="comment_${c.id}" value="${cmt.replace(/"/g,'&quot;')}" placeholder="Izoh (ixtiyoriy)">
      </div>
    `;
  }).join("");

  saveBtn.disabled = false;
}

// ============ SAQLASH ============
async function saveEvaluations() {
  const classId = classSelect.value;
  const weekId  = weekSelect.value;
  if (!classId || !weekId) return;

  resultMsg.innerHTML = "";

  // Har bir mezon uchun qiymatni tekshirish
  const rows = [];
  for (const c of myCriteria) {
    const input = document.getElementById("score_" + c.id);
    const comment = document.getElementById("comment_" + c.id);
    const raw = input.value.trim();

    if (raw === "") continue; // bo'sh qoldirilgan bo'lsa — o'tkazib yuboramiz

    const val = parseFloat(raw);
    if (isNaN(val) || val < 0 || val > c.max_score) {
      resultMsg.innerHTML = `<div class="error">"${c.name}" uchun noto'g'ri ball: 0 — ${c.max_score} orasida bo'lishi kerak.</div>`;
      return;
    }
    rows.push({
      class_id:     parseInt(classId),
      week_id:      parseInt(weekId),
      criterion_id: c.id,
      staff_id:     currentStaffId,
      score:        val,
      comment:      comment.value.trim() || null
    });
  }

  if (rows.length === 0) {
    resultMsg.innerHTML = `<div class="error">Hech qanday ball kiritilmadi.</div>`;
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = "Saqlanmoqda...";

  // Upsert: agar mavjud bo'lsa yangilaydi, bo'lmasa qo'shadi
  // Buning uchun evaluations jadvalida UNIQUE (class_id, week_id, criterion_id, staff_id) bo'lishi kerak
  const { error } = await supabaseClient
    .from("evaluations")
    .upsert(rows, { onConflict: "class_id,week_id,criterion_id,staff_id" });

  saveBtn.disabled = false;
  saveBtn.textContent = "Saqlash";

  if (error) {
    resultMsg.innerHTML = `<div class="error">Saqlashda xato: ${error.message}</div>`;
    return;
  }

  resultMsg.innerHTML = `<div class="success">✅ ${rows.length} ta ball muvaffaqiyatli saqlandi!</div>`;
  // Formani qayta yuklash (yangi qiymatlarni ko'rsatish uchun)
  setTimeout(loadEvaluationForm, 800);
}

checkSession();
</script>
</body>
</html>
