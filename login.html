<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tizimga kirish | 54-MAKTAB</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --primary: #2563EB; --bg: #F8FAFC; --text: #1E293B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
  .login-card h2 { color: var(--text); margin-bottom: 30px; font-size: 24px; }
  input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; font-family: inherit; }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
  button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  button:hover { background: #1D4ED8; }
  #msg { color: #EF4444; margin-top: 15px; font-size: 14px; }
  a { display: block; margin-top: 20px; color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 600;}
</style>
</head>
<body>

<div class="login-card">
  <h2>54-MAKTAB TIZIMI</h2>
  <input id="email" type="email" placeholder="Email manzilingiz">
  <input id="password" type="password" placeholder="Parolingiz">
  <button id="loginBtn">Tizimga kirish</button>
  <p id="msg"></p>
  <a href="index.html">⬅ Bosh sahifaga qaytish</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
document.getElementById("loginBtn").onclick = async () => {
  const msg = document.getElementById("msg");
  msg.textContent = "Tekshirilmoqda...";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  
  // 1. Tizimga kirish
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  
  if (error) { msg.textContent = "Email yoki parol xato!"; return; }
  
  const userId = data.user.id;
  
  // 2. Foydalanuvchi qaysi rolga tegishli ekanligini aniqlash
  const { data: staff } = await supabaseClient.from("staff").select("role").eq("id", userId).maybeSingle();
  
  if (!staff) {
    msg.textContent = "Sizning hisobingiz tizimda topilmadi.";
    await supabaseClient.auth.signOut();
    return;
  }

  // 3. Rolga qarab yo'naltirish
  if (staff.role === "admin") {
    // Admin panelga (u yerdan hamma narsani boshqaradi)
    window.location.href = "admin.html";
  } else {
    // Qolgan barcha xodimlar (hakamlar) staff.html ga o'tadi
    window.location.href = "staff.html";
  }
};
</script>
</body>
</html>
