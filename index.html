<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>54-MAKTAB | Class Rating 360</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #4F46E5;
  --primary-light: #EEF2FF;
  --bg: #F3F4F6;
  --card-bg: #FFFFFF;
  --text: #111827;
  --text-muted: #6B7280;
  --border: #E5E7EB;
  --gold: #F59E0B;
  --silver: #9CA3AF;
  --bronze: #D97706;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

header {
  background: linear-gradient(135deg, #1E1B4B, #4F46E5);
  color: white;
  text-align: center;
  padding: 60px 20px 70px;
  border-bottom-left-radius: 40px;
  border-bottom-right-radius: 40px;
  box-shadow: 0 10px 30px rgba(79, 70, 229, 0.2);
  position: relative;
  overflow: hidden;
}

header::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
  animation: rotate 20s linear infinite;
}
@keyframes rotate { 100% { transform: rotate(360deg); } }

header h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; position: relative; z-index: 1;}
header p { font-size: 16px; opacity: 0.9; margin-bottom: 25px; position: relative; z-index: 1;}

.login-btn {
  display: inline-block;
  background: white;
  color: var(--primary);
  padding: 14px 35px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 700;
  font-size: 16px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
  transition: all 0.3s;
  position: relative;
  z-index: 1;
}
.login-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }

main {
  max-width: 1000px;
  margin: -30px auto 50px;
  padding: 0 15px;
  position: relative;
  z-index: 10;
}

.week-panel {
  background: var(--card-bg);
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  border: 1px solid var(--border);
  margin-bottom: 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 15px;
}

.week-panel label { font-weight: 700; font-size: 18px; color: var(--text); }
.week-panel select {
  padding: 12px 20px;
  border-radius: 12px;
  border: 2px solid var(--border);
  font-size: 16px;
  font-family: inherit;
  font-weight: 600;
  color: var(--primary);
  background: var(--primary-light);
  cursor: pointer;
  outline: none;
  transition: border 0.2s;
}
.week-panel select:focus { border-color: var(--primary); }

.podium-section {
  background: var(--card-bg);
  border-radius: 24px;
  padding: 30px 20px;
  margin-bottom: 30px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  border: 1px solid var(--border);
  text-align: center;
}

.section-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.podium-container {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
  min-height: 230px;
}

.podium-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 30%;
  max-width: 160px;
}

.podium-name { font-weight: 800; font-size: 18px; margin-bottom: 5px; color: var(--text); }
.podium-score { font-weight: 600; font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }

.podium-block {
  width: 100%;
  border-radius: 16px 16px 0 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 15px;
  color: white;
  font-size: 32px;
  box-shadow: inset 0 4px 0 rgba(255,255,255,0.3);
}

.podium-1 .podium-block { height: 160px; background: linear-gradient(180deg, #FCD34D, #F59E0B); }
.podium-2 .podium-block { height: 120px; background: linear-gradient(180deg, #CBD5E1, #94A3B8); }
.podium-3 .podium-block { height: 90px; background: linear-gradient(180deg, #D97706, #B45309); }

.contenders-box {
  background: var(--primary-light);
  border: 2px dashed #A5B4FC;
  border-radius: 20px;
  padding: 30px 20px;
  text-align: center;
}
.contenders-box h3 { font-size: 20px; color: var(--primary); margin-bottom: 10px; }
.contenders-box p { color: var(--text-muted); font-size: 15px; margin-bottom: 20px; }
.contenders-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
.contender-badge {
  background: white;
  color: var(--primary);
  padding: 10px 20px;
  border-radius: 30px;
  font-weight: 700;
  font-size: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  border: 1px solid #C7D2FE;
  display: flex;
  align-items: center;
  gap: 8px;
}

.class-row {
  display: flex;
  align-items: center;
  padding: 15px 20px;
  border-radius: 16px;
  margin-bottom: 10px;
  background: #F9FAFB;
  border: 1px solid var(--border);
  transition: transform 0.2s, background 0.2s;
}
.class-row:hover { transform: translateX(5px); background: var(--primary-light); border-color: #C7D2FE; }

.rank { font-size: 18px; font-weight: 800; color: var(--text-muted); width: 40px; text-align: left; }
.class-name { flex-grow: 1; font-size: 17px; font-weight: 700; text-align: left;}
.score { font-size: 18px; font-weight: 800; color: var(--primary); }

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 40px;
}

.info-card {
  background: var(--card-bg);
  border-radius: 24px;
  padding: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  border: 1px solid var(--border);
}

.info-card h3 {
  font-size: 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--primary);
  border-bottom: 2px solid var(--primary-light);
  padding-bottom: 10px;
}

.criteria-list { list-style: none; }
.criteria-list li {
  padding: 12px 0;
  border-bottom: 1px dashed var(--border);
  display: flex;
  justify-content: space-between;
  font-weight: 600;
  font-size: 15px;
}
.criteria-list li:last-child { border: none; }
.criteria-list li span { color: var(--primary); background: var(--primary-light); padding: 2px 10px; border-radius: 10px; font-size: 13px; }

.judge-list { display: flex; flex-direction: column; gap: 15px; }
.judge-item {
  display: flex;
  align-items: center;
  gap: 15px;
  background: #F9FAFB;
  padding: 15px;
  border-radius: 16px;
  border: 1px solid var(--border);
}
.judge-avatar {
  width: 45px; height: 45px;
  background: linear-gradient(135deg, var(--primary), #818CF8);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 18px;
  flex-shrink: 0;
}
.judge-info h4 { font-size: 16px; margin: 0; color: var(--text); }
.judge-info p { font-size: 13px; margin: 0; color: var(--text-muted); }

.loading-box { text-align: center; padding: 30px; color: var(--text-muted); }
.error-box { background: #FEE2E2; border-left: 4px solid #EF4444; padding: 15px; border-radius: 8px; color: #991B1B; font-weight: 600; margin: 15px 0; }

@media (max-width: 768px) {
  .info-grid { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
  header h1 { font-size: 24px; }
  .week-panel { flex-direction: column; text-align: center; }
  .week-panel select { width: 100%; }
  .podium-name { font-size: 14px; }
  .podium-score { font-size: 12px; }
  .podium-block { font-size: 24px; }
}
</style>
</head>
<body>

<header>
  <h1>🏆 54-MAKTAB CLASS RATING 360</h1>
  <p>Har haftalik g'oliblar, adolatli baholash va shaffof natijalar</p>
  <a href="login.html" class="login-btn">🔐 Tizimga kirish</a>
</header>

<main>
  <div class="week-panel">
    <label>📅 Haftalik natijalar:</label>
    <select id="weekSelect">
      <option value="">Yuklanmoqda...</option>
    </select>
  </div>

  <div class="podium-section">
    <div class="section-title">🥇 Boshlang'ich sinflar</div>
    <div id="primaryPodium" class="podium-container"></div>
    <div id="primaryList" style="margin-top: 30px;"></div>
  </div>

  <div class="podium-section">
    <div class="section-title">🏆 Yuqori sinflar</div>
    <div id="upperPodium" class="podium-container"></div>
    <div id="upperList" style="margin-top: 30px;"></div>
  </div>

  <div class="info-grid">
    <div class="info-card">
      <h3>📋 Baholash mezonlari</h3>
      <ul class="criteria-list" id="criteriaList">
        <li class="loading-box">Yuklanmoqda...</li>
      </ul>
    </div>
    <div class="info-card">
      <h3>⚖️ Mas'ul hakamlar</h3>
      <div class="judge-list" id="judgesList">
        <p class="loading-box">Yuklanmoqda...</p>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<script>
let allClasses = [];
let allWeeks = [];
let allEvals = [];

// ==================== MA'LUMOTLARNI YUKLASH ====================
async function initData() {
  try {
    // 1. Sinflar
    const { data: cls, error: clsErr } = await supabaseClient
      .from("classes").select("id, name, level");

    if (clsErr) throw new Error("Sinflar: " + clsErr.message);
    allClasses = cls || [];

    // 2. Haftalar
    const { data: wks, error: wkErr } = await supabaseClient
      .from("weeks").select("id, title, start_date, end_date")
      .order("start_date", { ascending: false });

    if (wkErr) throw new Error("Haftalar: " + wkErr.message);
    allWeeks = wks || [];

    // 3. Baholashlar
    const { data: evals, error: evErr } = await supabaseClient
      .from("evaluations").select("class_id, week_id, score");

    if (evErr) throw new Error("Baholashlar: " + evErr.message);
    allEvals = evals || [];

    // 4. Mezonlar
    const { data: criteria, error: critErr } = await supabaseClient
      .from("criteria").select("id, name, max_score");

    if (critErr) throw new Error("Mezonlar: " + critErr.message);

    document.getElementById("criteriaList").innerHTML = (criteria || []).length
      ? (criteria || []).map(c =>
          `<li>${c.name} <span>${c.max_score} ball</span></li>`
        ).join("")
      : `<li class="loading-box">Mezonlar topilmadi</li>`;

    // 5. Hakamlar — alohida so'rovlar bilan birlashtiramiz
    const { data: scData, error: scErr } = await supabaseClient
      .from("staff_criteria").select("staff_id, criterion_id");

    if (scErr) throw new Error("staff_criteria: " + scErr.message);

    const { data: staffList, error: staffErr } = await supabaseClient
      .from("staff").select("id, full_name");

    if (staffErr) throw new Error("staff: " + staffErr.message);

    const staffMap = {};
    (staffList || []).forEach(s => { staffMap[s.id] = s.full_name; });

    const critMap = {};
    (criteria || []).forEach(c => { critMap[c.id] = c.name; });

    const judgesDiv = document.getElementById("judgesList");
    const judges = (scData || []).map(x => ({
      name: staffMap[x.staff_id] || "Noma'lum hakam",
      criterion: critMap[x.criterion_id] || "Mezon yo'q"
    }));

    if (judges.length > 0) {
      judgesDiv.innerHTML = judges.map(j => {
        const initial = j.name.charAt(0).toUpperCase();
        return `
          <div class="judge-item">
            <div class="judge-avatar">${initial}</div>
            <div class="judge-info">
              <h4>${j.name}</h4>
              <p>${j.criterion}</p>
            </div>
          </div>
        `;
      }).join("");
    } else {
      judgesDiv.innerHTML = `<p class="loading-box">Hakamlar topilmadi</p>`;
    }

    // 6. Hafta tanlash
    const weekSelect = document.getElementById("weekSelect");
    if (allWeeks.length > 0) {
      weekSelect.innerHTML = allWeeks.map((w, i) =>
        `<option value="${w.id}" ${i === 0 ? "selected" : ""}>${w.title} (${w.start_date} - ${w.end_date})</option>`
      ).join("");
      weekSelect.addEventListener("change", () => renderWeek(weekSelect.value));
      renderWeek(allWeeks[0].id);
    } else {
      weekSelect.innerHTML = `<option value="">Haftalar topilmadi</option>`;
    }

  } catch (err) {
    console.error("initData xato:", err);
    document.getElementById("criteriaList").innerHTML =
      `<li class="error-box">Xato: ${err.message}</li>`;
    document.getElementById("judgesList").innerHTML =
      `<div class="error-box">Xato: ${err.message}</div>`;
    document.getElementById("weekSelect").innerHTML =
      `<option value="">Xato yuz berdi</option>`;
  }
}

// ==================== HAFTANI CHIZISH ====================
function renderWeek(selectedWeekId) {
  if (!selectedWeekId) return;

  const selectedWeekIndex = allWeeks.findIndex(w => w.id == selectedWeekId);
  const prevWeekId = selectedWeekIndex < allWeeks.length - 1
    ? allWeeks[selectedWeekIndex + 1].id
    : null;

  const classStats = {};
  allClasses.forEach(c => {
    classStats[c.id] = { info: c, current: 0, prev: 0 };
  });

  allEvals.forEach(e => {
    if (!classStats[e.class_id]) return;
    if (e.week_id == selectedWeekId) classStats[e.class_id].current += Number(e.score) || 0;
    if (e.week_id == prevWeekId) classStats[e.class_id].prev += Number(e.score) || 0;
  });

  const sorted = Object.values(classStats).sort((a, b) => b.current - a.current);

  drawPodium(sorted, "primary", "primaryPodium", "primaryList");
  drawPodium(sorted, "upper", "upperPodium", "upperList");
}

// ==================== PODIUM CHIZISH ====================
function drawPodium(sortedData, level, podiumId, listId) {
  const filtered = sortedData.filter(item => item.info.level === level);
  const podiumDiv = document.getElementById(podiumId);
  const listDiv = document.getElementById(listId);

  if (filtered.length === 0) {
    podiumDiv.innerHTML = `<div class="contenders-box"><h3>Sinflar yo'q</h3></div>`;
    listDiv.innerHTML = "";
    return;
  }

  if (filtered[0].current === 0) {
    const contendersHtml = filtered.map(f =>
      `<div class="contender-badge">🏅 ${f.info.name}</div>`
    ).join("");

    podiumDiv.innerHTML = `
      <div class="contenders-box">
        <h3>⏳ G'oliblar aniqlanmoqda</h3>
        <p>Ushbu hafta uchun hali ballar to'liq kiritilmagan. Barcha sinflar g'oliblikka da'vogar:</p>
        <div class="contenders-list">${contendersHtml}</div>
      </div>`;
    listDiv.innerHTML = "";
    return;
  }

  const top3 = filtered.filter(f => f.current > 0).slice(0, 3);
  const rest = filtered.slice(top3.length);

  const p1 = top3[0] ? `<div class="podium-item podium-1"><div class="podium-name">${top3[0].info.name}</div><div class="podium-score">${top3[0].current} ball</div><div class="podium-block">🥇</div></div>` : "";
  const p2 = top3[1] ? `<div class="podium-item podium-2"><div class="podium-name">${top3[1].info.name}</div><div class="podium-score">${top3[1].current} ball</div><div class="podium-block">🥈</div></div>` : "";
  const p3 = top3[2] ? `<div class="podium-item podium-3"><div class="podium-name">${top3[2].info.name}</div><div class="podium-score">${top3[2].current} ball</div><div class="podium-block">🥉</div></div>` : "";

  podiumDiv.innerHTML = p2 + p1 + p3;

  listDiv.innerHTML = rest.map((item, index) => {
    const rank = index + top3.length + 1;
    const diff = item.current - item.prev;
    let diffHtml = "";
    if (item.prev > 0) {
      if (diff > 0) diffHtml = `<span style="color:#10B981;font-size:13px;font-weight:bold;margin-left:10px;">▲ +${diff}</span>`;
      else if (diff < 0) diffHtml = `<span style="color:#EF4444;font-size:13px;font-weight:bold;margin-left:10px;">▼ ${diff}</span>`;
      else diffHtml = `<span style="color:#6B7280;font-size:13px;font-weight:bold;margin-left:10px;">—</span>`;
    }
    return `
      <div class="class-row">
        <div class="rank">${rank}</div>
        <div class="class-name">${item.info.name} ${diffHtml}</div>
        <div class="score">${item.current} ball</div>
      </div>
    `;
  }).join("");
}

initData();
</script>
</body>
</html>
