<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>54-MAKTAB | Class Rating 360</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #4F46E5;
  --primary-light: #EEF2FF;
  --bg: #F3F4F6;
  --card-bg: #FFFFFF;
  --text: #111827;
  --text-muted: #6B7280;
  --border: #E5E7EB;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

header {
  background: linear-gradient(135deg, #1E1B4B, #4F46E5);
  color: white; text-align: center; padding: 50px 20px 60px;
  border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
}
header h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
header p { font-size: 15px; opacity: 0.9; margin-bottom: 20px; }
.login-btn {
  display: inline-block; background: white; color: var(--primary);
  padding: 12px 30px; border-radius: 50px; text-decoration: none;
  font-weight: 700; font-size: 15px;
}

main { max-width: 1000px; margin: -25px auto 40px; padding: 0 15px; position: relative; z-index: 10; }

#statusBox {
  background: #FEF3C7; border-left: 4px solid #F59E0B;
  padding: 12px 15px; border-radius: 10px; margin-bottom: 15px;
  font-size: 14px; font-weight: 600; color: #92400E;
}
#errorBox {
  background: #FEE2E2; border-left: 4px solid #EF4444;
  padding: 12px 15px; border-radius: 10px; margin-bottom: 15px;
  font-size: 14px; font-weight: 600; color: #991B1B; white-space: pre-wrap;
  display: none;
}

.week-panel {
  background: var(--card-bg); padding: 18px; border-radius: 16px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid var(--border);
  margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.week-panel label { font-weight: 700; font-size: 16px; }
.week-panel select {
  flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 10px;
  border: 2px solid var(--border); font-size: 15px; font-family: inherit;
  font-weight: 600; color: var(--primary); background: var(--primary-light);
}

.section {
  background: var(--card-bg); border-radius: 20px; padding: 20px;
  margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
  border: 1px solid var(--border);
}
.section h2 {
  font-size: 19px; font-weight: 800; margin-bottom: 18px;
  text-align: center; color: var(--text);
}

.podium {
  display: flex; align-items: flex-end; justify-content: center;
  gap: 10px; min-height: 200px; margin-bottom: 15px;
}
.p-item { display: flex; flex-direction: column; align-items: center; width: 30%; max-width: 150px; }
.p-name { font-weight: 800; font-size: 16px; margin-bottom: 4px; text-align: center; }
.p-score { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.p-block {
  width: 100%; border-radius: 14px 14px 0 0; display: flex;
  justify-content: center; align-items: flex-start; padding-top: 12px;
  color: white; font-size: 28px;
}
.p-1 .p-block { height: 150px; background: linear-gradient(180deg, #FCD34D, #F59E0B); }
.p-2 .p-block { height: 110px; background: linear-gradient(180deg, #CBD5E1, #94A3B8); }
.p-3 .p-block { height: 80px; background: linear-gradient(180deg, #D97706, #B45309); }

.row {
  display: flex; align-items: center; padding: 12px 15px;
  border-radius: 12px; margin-bottom: 8px; background: #F9FAFB;
  border: 1px solid var(--border);
}
.row .rank { font-weight: 800; color: var(--text-muted); width: 35px; }
.row .name { flex: 1; font-weight: 700; font-size: 15px; }
.row .score { font-weight: 800; color: var(--primary); font-size: 16px; }

.empty { text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px; }

.badge-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.badge {
  background: var(--primary-light); color: var(--primary);
  padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 14px;
  border: 1px solid #C7D2FE;
}

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
@media (max-width: 700px) { .info-grid { grid-template-columns: 1fr; } }

.info-card {
  background: var(--card-bg); border-radius: 20px; padding: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid var(--border);
}
.info-card h3 {
  font-size: 17px; color: var(--primary); margin-bottom: 15px;
  border-bottom: 2px solid var(--primary-light); padding-bottom: 8px;
}
.crit-item {
  display: flex; justify-content: space-between; padding: 10px 0;
  border-bottom: 1px dashed var(--border); font-weight: 600; font-size: 14px;
}
.crit-item:last-child { border: none; }
.crit-item span { color: var(--primary); background: var(--primary-light); padding: 2px 8px; border-radius: 8px; font-size: 12px; }

/* Hakamlar kartochkasi */
.judge-item {
  display: flex; align-items: center; gap: 12px; background: #F9FAFB;
  padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 8px;
  cursor: pointer; transition: background 0.2s, transform 0.1s;
}
.judge-item:hover { background: var(--primary-light); border-color: #C7D2FE; transform: scale(1.02); }
.judge-avatar {
  width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), #818CF8);
  color: white; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0;
}
.judge-info h4 { font-size: 14px; margin: 0; }
.judge-info p { font-size: 12px; margin: 0; color: var(--text-muted); }
.judge-click-hint { font-size: 11px; color: var(--primary); font-weight: 700; margin-top: 3px; display: block; }

/* MODAL OYNA (Batafsil ma'lumot uchun) */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-content {
  background: white; border-radius: 20px; max-width: 500px; width: 100%;
  max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  transform: translateY(20px); transition: transform 0.3s;
}
.modal-overlay.active .modal-content { transform: translateY(0); }

.modal-header {
  padding: 20px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; background: white; border-radius: 20px 20px 0 0; z-index: 2;
}
.modal-header h3 { margin: 0; font-size: 18px; color: var(--text); }
.modal-close {
  background: #F3F4F6; border: none; width: 32px; height: 32px; border-radius: 50%;
  font-size: 18px; font-weight: bold; color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: #E5E7EB; color: var(--text); }

.modal-body { padding: 20px; font-size: 14px; color: var(--text); line-height: 1.6; }
.modal-body p { margin-bottom: 12px; }
.modal-body strong { color: var(--primary); display: block; margin-top: 15px; margin-bottom: 4px; }
.modal-body ul { padding-left: 20px; margin-bottom: 15px; }
.modal-body li { margin-bottom: 8px; }
.modal-body .score-range { font-weight: 700; color: var(--text); }

</style>
</head>
<body>

<header>
  <h1>🏆 54-MAKTAB CLASS RATING 360</h1>
  <p>Har haftalik g'oliblar va shaffof natijalar</p>
  <a href="login.html" class="login-btn">🔐 Tizimga kirish</a>
</header>

<main>
  <div id="statusBox">⏳ Ma'lumotlar yuklanmoqda...</div>
  <div id="errorBox"></div>

  <div class="week-panel">
    <label>📅 Hafta:</label>
    <select id="weekSelect"><option value="">Yuklanmoqda...</option></select>
  </div>

  <div class="section">
    <h2>🥇 Boshlang'ich sinflar</h2>
    <div id="primaryPodium" class="podium"></div>
    <div id="primaryList"></div>
  </div>

  <div class="section">
    <h2>🏆 Yuqori sinflar</h2>
    <div id="upperPodium" class="podium"></div>
    <div id="upperList"></div>
  </div>

  <div class="info-grid">
    <div class="info-card">
      <h3>📋 Baholash mezonlari</h3>
      <div id="criteriaList"><div class="empty">Yuklanmoqda...</div></div>
    </div>
    <div class="info-card">
      <h3>⚖️ Mas'ul hakamlar</h3>
      <div id="judgesList"><div class="empty">Yuklanmoqda...</div></div>
      <div style="text-align:center; margin-top:10px; font-size:12px; color:var(--text-muted);">Batafsil ma'lumot uchun hakam ustiga bosing</div>
    </div>
  </div>
</main>

<!-- MODAL OYNA -->
<div class="modal-overlay" id="infoModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Hakam haqida</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<script>
// ================= MEZONLAR HAQIDA MA'LUMOT =================
const criteriaInfo = {
  "Tashabbuskorlik": `
    <p>Bu yerda o'quvchining darsda va darsdan tashqari vaqtda o'z fikrini aytishi, savollar berishi, yangi g'oyalar taklif qilishi hisobga olinadi.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">9-10 ball:</span> Darslarda doim faol, mustaqil fikrlaydi, yangi g'oyalar beradi.</li>
      <li><span class="score-range">6-8 ball:</span> O'rtacha faollik, savollar beradi, topshiriqlarni bajaradi.</li>
      <li><span class="score-range">3-5 ball:</span> Faqat so'ralganda javob beradi, passiv.</li>
      <li><span class="score-range">0-2 ball:</span> Darsda qatnashmaydi, befarq.</li>
    </ul>
  `,
  "Maktab tadbirlaridagi faollik": `
    <p>Maktab miqyosidagi bayramlar, tanlovlar, sport musobaqalarida qatnashish.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">9-10 ball:</span> Barcha tadbirlarda faol, tashkil qilishda yordam beradi.</li>
      <li><span class="score-range">6-8 ball:</span> Ko'pchilik tadbirlarda qatnashadi.</li>
      <li><span class="score-range">3-5 ball:</span> Ba'zi tadbirlarda qatnashadi.</li>
      <li><span class="score-range">0-2 ball:</span> Tadbirlarga qatnashmaydi.</li>
    </ul>
  `,
  "Oquv natijalari": `
    <p>Sinfning choraklik baholari, nazorat ishlari natijalari.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">22-25 ball:</span> O'zlashtirish eng yuqori (90-100%).</li>
      <li><span class="score-range">16-21 ball:</span> Yaxshi o'zlashtirish, bir nechta past baholar.</li>
      <li><span class="score-range">8-15 ball:</span> O'rtacha o'zlashtirish.</li>
      <li><span class="score-range">0-7 ball:</span> O'zlashtirish juda past.</li>
    </ul>
  `,
  "Davomat": `
    <p>Darslarga qatnashish, sababsiz dars qoldirmaslik.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">18-20 ball:</span> Bitta ham sababsiz dars qoldirilmagan.</li>
      <li><span class="score-range">13-17 ball:</span> 1-2 ta sababsiz dars qoldirilgan.</li>
      <li><span class="score-range">7-12 ball:</span> 3-5 ta sababsiz dars qoldirilgan.</li>
      <li><span class="score-range">0-6 ball:</span> Ko'plab dars qoldirishlar.</li>
    </ul>
  `,
  "Tozalik va tartib": `
    <p>Sinf xonasining tozaligi, partalar va jihozlarning holati.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">9-10 ball:</span> Sinf xonasi doim toza, tartibda.</li>
      <li><span class="score-range">6-8 ball:</span> Kichik kamchiliklar bor.</li>
      <li><span class="score-range">3-5 ball:</span> Tartibsiz, chiqindilar bor.</li>
      <li><span class="score-range">0-2 ball:</span> Juda iflos, buzilgan.</li>
    </ul>
  `,
  "Intizom va xulq-atvor": `
    <p>O'quvchilarning dars va tanaffusdagi o'zini tutishi.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">13-15 ball:</span> Intizom yaxshi, hurmatda.</li>
      <li><span class="score-range">9-12 ball:</span> Kichik tartibbuzarliklar.</li>
      <li><span class="score-range">5-8 ball:</span> Tez-tez tartibbuzarlik.</li>
      <li><span class="score-range">0-4 ball:</span> Doimiy tartibbuzarlik, janjallar.</li>
    </ul>
  `,
  "Kitobxonlik": `
    <p>Kutubxonadan kitob olish, o'qilgan kitoblar bo'yicha suhbatlar.</p>
    <strong>Baholash me'yorlari:</strong>
    <ul>
      <li><span class="score-range">9-10 ball:</span> Ko'pchilik kutubxonaga a'zo, har oyda kitob o'qiydi.</li>
      <li><span class="score-range">6-8 ball:</span> O'rtacha darajada kitob o'qishadi.</li>
      <li><span class="score-range">3-5 ball:</span> Juda kam o'quvchilar o'qiydi.</li>
      <li><span class="score-range">0-2 ball:</span> Kutubxonaga qatnamaydi.</li>
    </ul>
  `
};

const statusBox = document.getElementById("statusBox");
const errorBox = document.getElementById("errorBox");

// Modal elementlari
const modal = document.getElementById("infoModal");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");
const modalClose = document.getElementById("modalClose");

function showError(msg) { errorBox.style.display = "block"; errorBox.textContent = "❌ " + msg; }
function setStatus(msg) { statusBox.textContent = msg; }

modalClose.onclick = () => modal.classList.remove("active");
modal.onclick = (e) => { if (e.target === modal) modal.classList.remove("active"); };

window.onerror = function(msg, src, line) { showError(msg + " (qator: " + line + ")"); };
window.addEventListener("unhandledrejection", function(e) {
  showError(e.reason && e.reason.message ? e.reason.message : String(e.reason));
});

let allClasses = [], allWeeks = [], allEvals = [];

async function init() {
  try {
    if (typeof supabaseClient === "undefined") {
      showError("supabaseClient aniqlanmadi. supabase-config.js yuklanmagan.");
      return;
    }
    
    // 1. Sinflar
    const clsRes = await supabaseClient.from("classes").select("id, name, level");
    if (clsRes.error) { showError("Sinflar: " + clsRes.error.message); return; }
    allClasses = clsRes.data || [];

    // 2. Haftalar
    const wkRes = await supabaseClient.from("weeks").select("id, title, start_date, end_date").order("start_date", { ascending: false });
    if (wkRes.error) { showError("Haftalar: " + wkRes.error.message); return; }
    allWeeks = wkRes.data || [];

    // 3. Baholashlar
    const evRes = await supabaseClient.from("evaluations").select("class_id, week_id, score");
    if (evRes.error) { showError("Baholashlar: " + evRes.error.message); return; }
    allEvals = evRes.data || [];

    // 4. Mezonlar
    const critRes = await supabaseClient.from("criteria").select("id, name, max_score");
    if (critRes.error) { showError("Mezonlar: " + critRes.error.message); return; }
    const criteria = critRes.data || [];
    renderCriteria(criteria);

    // 5. Hakamlar
    const scRes = await supabaseClient.from("staff_criteria").select("staff_id, criterion_id");
    if (scRes.error) { showError("staff_criteria: " + scRes.error.message); return; }
    
    const staffRes = await supabaseClient.from("staff").select("id, full_name");
    if (staffRes.error) { showError("staff: " + staffRes.error.message); return; }
    
    renderJudges(scRes.data || [], staffRes.data || [], criteria);

    // 6. Hafta
    if (allWeeks.length === 0) {
      document.getElementById("weekSelect").innerHTML = '<option value="">Hafta yo\'q</option>';
      return;
    }
    const ws = document.getElementById("weekSelect");
    ws.innerHTML = allWeeks.map((w, i) =>
      `<option value="${w.id}" ${i===0?"selected":""}>${w.title} (${w.start_date} - ${w.end_date})</option>`
    ).join("");
    ws.onchange = () => renderWeek(ws.value);
    renderWeek(allWeeks[0].id);

    statusBox.style.display = "none"; // Muvaffaqiyatli yuklandi, sariq qutini yashirish

  } catch (err) {
    showError("Xato: " + (err.message || err));
  }
}

function renderCriteria(criteria) {
  const el = document.getElementById("criteriaList");
  if (!criteria.length) {
    el.innerHTML = '<div class="empty">Mezonlar topilmadi</div>';
    return;
  }
  el.innerHTML = criteria.map(c =>
    `<div class="crit-item">${c.name} <span>${c.max_score} ball</span></div>`
  ).join("");
}

// Hakamlarni chiqarish (Ustiga bosish effekti bilan)
function renderJudges(scData, staffList, criteria) {
  const el = document.getElementById("judgesList");
  const staffMap = {};
  staffList.forEach(s => { staffMap[s.id] = s.full_name; });
  const critMap = {};
  criteria.forEach(c => { critMap[c.id] = c.name; });

  if (!scData.length) {
    el.innerHTML = '<div class="empty">Hakamlar topilmadi</div>';
    return;
  }

  el.innerHTML = scData.map(x => {
    const name = staffMap[x.staff_id] || "Noma'lum";
    const crit = critMap[x.criterion_id] || "Mezon yo'q";
    
    // Hakam ustiga bosilganda modal ochiladi
    return `
      <div class="judge-item" onclick="openJudgeModal('${name}', '${crit}')">
        <div class="judge-avatar">${name.charAt(0).toUpperCase()}</div>
        <div class="judge-info">
          <h4>${name}</h4>
          <p>${crit}</p>
          <span class="judge-click-hint">Batafsil ma'lumot olish uchun bosing 👆</span>
        </div>
      </div>
    `;
  }).join("");
}

// Modalni ochish funksiyasi
window.openJudgeModal = function(name, critName) {
  modalTitle.textContent = name + " - Baholash vazifasi";
  
  const info = criteriaInfo[critName] || "<p>Bu mezon haqida ma'lumot kiritilmagan.</p>";
  
  modalBody.innerHTML = `
    <div style="background:#EEF2FF; padding:15px; border-radius:10px; margin-bottom:15px; border:1px solid #C7D2FE;">
      <p style="margin:0; font-weight:700; color:var(--primary);">Ushbu hakam quyidagi mezon bo'yicha baholaydi:</p>
      <div style="font-size:18px; font-weight:800; color:var(--text); margin-top:5px;">${critName}</div>
    </div>
    <p style="font-weight:700;">Qanday tartibda va nimaga qarab baholanadi?</p>
    ${info}
  `;
  
  modal.classList.add("active");
};

// Qolgan (Podium chizish) funksiyalar o'zgartirilmagan...
function renderWeek(weekId) {
  if (!weekId) return;
  const idx = allWeeks.findIndex(w => w.id == weekId);
  const prevId = idx < allWeeks.length - 1 ? allWeeks[idx + 1].id : null;

  const stats = {};
  allClasses.forEach(c => { stats[c.id] = { info: c, cur: 0, prev: 0 }; });

  allEvals.forEach(e => {
    if (!stats[e.class_id]) return;
    if (e.week_id == weekId) stats[e.class_id].cur += Number(e.score) || 0;
    if (e.week_id == prevId) stats[e.class_id].prev += Number(e.score) || 0;
  });

  const sorted = Object.values(stats).sort((a, b) => b.cur - a.cur);
  draw(sorted, "primary", "primaryPodium", "primaryList");
  draw(sorted, "upper", "upperPodium", "upperList");
}

function draw(sorted, level, podiumId, listId) {
  const filtered = sorted.filter(x => x.info.level === level);
  const podium = document.getElementById(podiumId);
  const list = document.getElementById(listId);

  if (!filtered.length) {
    podium.innerHTML = '<div class="empty">Bu darajada sinflar yo\'q</div>';
    list.innerHTML = "";
    return;
  }

  if (filtered[0].cur === 0) {
    podium.innerHTML = `
      <div style="text-align:center;padding:20px;">
        <div style="font-weight:700;margin-bottom:12px;">⏳ G'oliblar aniqlanmoqda</div>
        <div class="badge-list">
          ${filtered.map(f => `<div class="badge">🏅 ${f.info.name}</div>`).join("")}
        </div>
      </div>`;
    list.innerHTML = "";
    return;
  }

  const top3 = filtered.filter(f => f.cur > 0).slice(0, 3);
  const rest = filtered.slice(top3.length);

  const block = (item, cls, medal, rank) => item
    ? `<div class="p-item p-${rank}"><div class="p-name">${item.info.name}</div><div class="p-score">${item.cur} ball</div><div class="p-block">${medal}</div></div>`
    : "";

  podium.innerHTML =
    block(top3[1], "p-2", "🥈", 2) +
    block(top3[0], "p-1", "🥇", 1) +
    block(top3[2], "p-3", "🥉", 3);

  list.innerHTML = rest.map((item, i) => {
    const rank = i + top3.length + 1;
    return `<div class="row"><div class="rank">${rank}</div><div class="name">${item.info.name}</div><div class="score">${item.cur} ball</div></div>`;
  }).join("");
}

init();
</script>
</body>
</html>
