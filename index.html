<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>54-MAKTAB | Class Rating 360</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* OCHIQ VA ZAMONAVIY DIZAYN */
:root {
  --primary: #2563EB;      /* Moviy */
  --primary-light: #EFF6FF;
  --accent: #F59E0B;       /* Oltin */
  --bg: #F8FAFC;           /* Ochiq kulrang fon */
  --card-bg: #FFFFFF;
  --text: #1E293B;
  --text-muted: #64748B;
  --success: #10B981;      /* Yashil (o'sish) */
  --danger: #EF4444;       /* Qizil (pasayish) */
  --border: #E2E8F0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

/* Header */
header {
  background: linear-gradient(135deg, var(--primary), #1D4ED8);
  color: white;
  text-align: center;
  padding: 40px 20px;
  border-bottom-left-radius: 30px;
  border-bottom-right-radius: 30px;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.15);
}

header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px;}
header p { font-size: 15px; opacity: 0.9; }

/* Asosiy konteyner */
main {
  max-width: 900px;
  margin: -20px auto 40px;
  padding: 0 15px;
  position: relative;
  z-index: 10;
}

/* Statistika kartalari */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.stat-card {
  background: var(--card-bg);
  padding: 20px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  border: 1px solid var(--border);
}

.stat-card h3 { font-size: 22px; color: var(--primary); font-weight: 700; margin-bottom: 4px;}
.stat-card p { font-size: 13px; color: var(--text-muted); font-weight: 500;}

/* Reyting bo'limlari */
.rating-section {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 25px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  border: 1px solid var(--border);
}

.rating-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 15px;
  border-bottom: 2px solid var(--border);
}

/* Sinf qatori (Dinamika bilan) */
.class-row {
  display: flex;
  align-items: center;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 10px;
  background: #fff;
  border: 1px solid var(--border);
  transition: transform 0.2s, box-shadow 0.2s;
}

.class-row:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(0,0,0,0.05);
}

/* TOP 1,2,3 */
.class-row.top-1 { border-left: 5px solid #F59E0B; background: #FFFBEB; }
.class-row.top-2 { border-left: 5px solid #94A3B8; background: #F8FAFC; }
.class-row.top-3 { border-left: 5px solid #B45309; background: #FEF3C7; }

/* O'rin */
.rank { font-size: 18px; font-weight: 700; color: var(--text-muted); width: 35px; }
.top-1 .rank { color: #D97706; font-size: 22px; }
.top-2 .rank { color: #64748B; font-size: 22px; }
.top-3 .rank { color: #B45309; font-size: 22px; }

/* Sinf nomi */
.class-name { flex-grow: 1; font-size: 17px; font-weight: 600; color: var(--text); }

/* DINAMIKA (Haftalik o'zgarish) */
.dynamics {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  margin-right: 20px;
  min-width: 80px;
}

.current-score { font-size: 18px; font-weight: 700; color: var(--primary); }

.diff-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
  margin-top: 4px;
  display: inline-block;
}

.diff-up { color: var(--success); background: #ECFDF5; }
.diff-down { color: var(--danger); background: #FEF2F2; }
.diff-same { color: var(--text-muted); background: #F1F5F9; }

/* Mobil moslashuv */
@media (max-width: 600px) {
  header h1 { font-size: 22px; }
  .stats-grid { grid-template-columns: 1fr; }
  .class-row { padding: 12px; }
  .class-name { font-size: 15px; }
  .current-score { font-size: 16px; }
  .dynamics { margin-right: 10px; min-width: 70px; }
}
</style>
</head>
<body>

<header>
  <h1>🏆 54-MAKTAB CLASS RATING 360</h1>
  <p>Haftalik dinamika va sinflar reytingi</p>
</header>

<main>
  <!-- Statistika -->
  <div class="stats-grid">
    <div class="stat-card">
      <h3>7 ta</h3>
      <p>Baholash mezonlari</p>
    </div>
    <div class="stat-card">
      <h3>100 ball</h3>
      <p>Maksimal natija</p>
    </div>
  </div>

  <!-- Reyting: Boshlang'ich sinflar -->
  <div class="rating-section">
    <div class="rating-title">
      <span>🥇</span> Boshlang'ich sinflar reytingi
    </div>
    <div id="primary-list">
      <div style="text-align: center; color: var(--text-muted); padding: 20px;">Ma'lumotlar yuklanmoqda...</div>
    </div>
  </div>

  <!-- Reyting: Yuqori sinflar -->
  <div class="rating-section">
    <div class="rating-title">
      <span>🏆</span> Yuqori sinflar reytingi
    </div>
    <div id="upper-list">
      <div style="text-align: center; color: var(--text-muted); padding: 20px;">Ma'lumotlar yuklanmoqda...</div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<script>
async function loadRatings() {
  try {
    // 1. Barcha sinflarni olamiz
    const { data: classes } = await supabaseClient.from("classes").select("*");
    
    // 2. Haftalarni sanasi bo'yicha olamiz
    const { data: weeks } = await supabaseClient.from("weeks").select("*").order("start_date", { ascending: false });
    
    // 3. Barcha baholarni olamiz
    const { data: evals } = await supabaseClient.from("evaluations").select("*");

    if (!classes || !weeks || !evals) return;

    // Joriy hafta (eng oxirgi boshlangan) va O'tgan haftani aniqlaymiz
    const currentWeekId = weeks.length > 0 ? weeks[0].id : null;
    const prevWeekId = weeks.length > 1 ? weeks[1].id : null;

    // Har bir sinf uchun jami ballarni hisoblaymiz
    let classStats = {};
    classes.forEach(c => classStats[c.id] = { info: c, currentTotal: 0, prevTotal: 0 });

    evals.forEach(e => {
      if (!classStats[e.class_id]) return;
      if (e.week_id === currentWeekId) classStats[e.class_id].currentTotal += Number(e.score);
      if (e.week_id === prevWeekId) classStats[e.class_id].prevTotal += Number(e.score);
    });

    // Reytingni joriy hafta ballari bo'yicha saralaymiz
    let sortedClasses = Object.values(classStats).sort((a, b) => b.currentTotal - a.currentTotal);

    // HTML yaratish funksiyasi
    const renderList = (arr, level) => {
      let filtered = arr.filter(item => item.info.level === level);
      if (filtered.length === 0) return `<div style="text-align:center;color:#94A3B8;padding:20px;">Hozircha natija yo'q</div>`;

      return filtered.map((item, index) => {
        let rankClass = index === 0 ? 'top-1' : index === 1 ? 'top-2' : index === 2 ? 'top-3' : '';
        let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1);
        
        // Haftalik farqni hisoblash
        let diff = item.currentTotal - item.prevTotal;
        let diffHtml = '';
        
        if (item.prevTotal > 0) { // Agar o'tgan hafta ma'lumoti bo'lsa
          if (diff > 0) {
            diffHtml = `<div class="diff-badge diff-up">▲ +${diff} o'sish</div>`;
          } else if (diff < 0) {
            diffHtml = `<div class="diff-badge diff-down">▼ ${diff} pasayish</div>`;
          } else {
            diffHtml = `<div class="diff-badge diff-same">— 0 o'zgarish</div>`;
          }
        } else if (item.currentTotal > 0) {
           diffHtml = `<div class="diff-badge diff-same">Yangi</div>`;
        } else {
           diffHtml = `<div class="diff-badge diff-same">—</div>`;
        }

        return `
          <div class="class-row ${rankClass}">
            <div class="rank">${medal}</div>
            <div class="class-name">${item.info.name}</div>
            <div class="dynamics">
              <div class="current-score">${item.currentTotal} ball</div>
              ${diffHtml}
            </div>
          </div>
        `;
      }).join('');
    };

    document.getElementById("primary-list").innerHTML = renderList(sortedClasses, "primary");
    document.getElementById("upper-list").innerHTML = renderList(sortedClasses, "upper");

  } catch (err) {
    console.error(err);
  }
}

loadRatings();
</script>
</body>
</html>
