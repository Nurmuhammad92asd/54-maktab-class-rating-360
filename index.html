<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>54-MAKTAB | Class Rating 360</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* KREATIV VA ZAMONAVIY DIZAYN */
:root {
  --primary: #4F46E5; /* Binafsha-ko'k */
  --primary-dark: #3730A3;
  --accent: #F59E0B; /* Oltin */
  --bg: #0F172A; /* To'q fon */
  --card-bg: rgba(30, 41, 59, 0.7); /* Shaffof karta */
  --text: #F8FAFC;
  --text-muted: #94A3B8;
  --success: #10B981;
  --danger: #EF4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Poppins', sans-serif;
  background-color: var(--bg);
  background-image: 
    radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
}

/* Header */
header {
  text-align: center;
  padding: 50px 20px 30px;
  position: relative;
}

header h1 {
  font-size: 32px;
  font-weight: 700;
  background: linear-gradient(to right, #F59E0B, #FCD34D);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

header p { color: var(--text-muted); font-size: 15px; }

/* Asosiy konteyner */
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px 50px;
}

/* Statistika kartalari */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.stat-card {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 25px;
  border-radius: 16px;
  text-align: center;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.stat-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(79, 70, 229, 0.2);
  border-color: rgba(79, 70, 229, 0.5);
}

.stat-card h3 { font-size: 28px; color: #fff; margin-bottom: 5px; font-weight: 700; }
.stat-card p { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

/* Reyting Jadvali (Kreativ) */
.rating-section {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 30px;
}

.rating-title {
  font-size: 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding-bottom: 15px;
}

.rating-title span { font-size: 24px; }

/* Sinf qatori */
.class-row {
  display: flex;
  align-items: center;
  padding: 15px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px;
  margin-bottom: 10px;
  transition: all 0.2s;
  border: 1px solid transparent;
}

.class-row:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(79, 70, 229, 0.3);
  transform: translateX(5px);
}

/* 1, 2, 3-o'rinlar uchun maxsus uslub */
.class-row.top-1 { 
  background: linear-gradient(90deg, rgba(245, 158, 11, 0.15) 0%, rgba(255,255,255,0.03) 100%);
  border: 1px solid rgba(245, 158, 11, 0.5);
}
.class-row.top-2 { 
  background: linear-gradient(90deg, rgba(148, 163, 184, 0.15) 0%, rgba(255,255,255,0.03) 100%);
  border: 1px solid rgba(148, 163, 184, 0.5);
}
.class-row.top-3 { 
  background: linear-gradient(90deg, rgba(180, 83, 9, 0.15) 0%, rgba(255,255,255,0.03) 100%);
  border: 1px solid rgba(180, 83, 9, 0.5);
}

/* O'rin raqami */
.rank { font-size: 20px; font-weight: 700; width: 40px; color: var(--text-muted); }
.top-1 .rank { color: #F59E0B; font-size: 24px; }
.top-2 .rank { color: #CBD5E1; font-size: 24px; }
.top-3 .rank { color: #D97706; font-size: 24px; }

/* Sinf nomi */
.class-name { flex-grow: 1; font-size: 18px; font-weight: 600; }

/* O'sish / Pasayish (Trend) */
.trend { display: flex; align-items: center; font-size: 14px; margin-right: 20px; padding: 5px 10px; border-radius: 20px; gap: 5px; }
.trend.up { color: var(--success); background: rgba(16, 185, 129, 0.1); }
.trend.down { color: var(--danger); background: rgba(239, 68, 68, 0.1); }
.trend.same { color: var(--text-muted); background: rgba(148, 163, 184, 0.1); }

/* Ball */
.score { font-size: 22px; font-weight: 700; color: #fff; min-width: 60px; text-align: right; }
.score span { font-size: 12px; color: var(--text-muted); font-weight: 400; }

/* Yuklanish animatsiyasi */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate { animation: fadeUp 0.5s ease forwards; opacity: 0; }

/* Mobil moslashuv */
@media (max-width: 600px) {
  header h1 { font-size: 24px; }
  .rating-section { padding: 20px 15px; }
  .class-row { padding: 12px; }
  .class-name { font-size: 16px; }
  .trend { font-size: 12px; padding: 4px 8px; margin-right: 10px; }
  .score { font-size: 18px; }
}
</style>
</head>
<body>

<header>
  <h1>🏆 54-MAKTAB CLASS RATING 360</h1>
  <p>Har hafta — yangi imkoniyat, har bir sinf — yangi natija!</p>
</header>

<main>
  <!-- Statistika -->
  <div class="stats-grid animate" style="animation-delay: 0.1s;">
    <div class="stat-card">
      <h3>Haftalik</h3>
      <p>Baholash davri</p>
    </div>
    <div class="stat-card">
      <h3>7 ta</h3>
      <p>Mezonlar soni</p>
    </div>
    <div class="stat-card">
      <h3>100</h3>
      <p>Eng yuqori ball</p>
    </div>
    <div class="stat-card">
      <h3 id="live-status">Live</h3>
      <p>Reyting holati</p>
    </div>
  </div>

  <!-- Reyting: Boshlang'ich sinflar -->
  <div class="rating-section animate" style="animation-delay: 0.2s;">
    <div class="rating-title">
      <span>🥇</span> Boshlang'ich sinflar TOP
    </div>
    <div id="primary-list">
      <div style="text-align: center; color: var(--text-muted); padding: 20px;">Ma'lumotlar yuklanmoqda...</div>
    </div>
  </div>

  <!-- Reyting: Yuqori sinflar -->
  <div class="rating-section animate" style="animation-delay: 0.3s;">
    <div class="rating-title">
      <span>🏆</span> Yuqori sinflar TOP
    </div>
    <div id="upper-list">
      <div style="text-align: center; color: var(--text-muted); padding: 20px;">Ma'lumotlar yuklanmoqda...</div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<script>
async function loadRatings() {
  try {
    // 1. Barcha sinflarni olamiz
    const { data: classes, error: classErr } = await supabaseClient
      .from("classes").select("*");
    if (classErr) throw classErr;

    // 2. Hozirgi barcha baholarni olamiz
    const { data: evals, error: evalErr } = await supabaseClient
      .from("evaluations").select("class_id, score");
    if (evalErr) throw evalErr;

    // 3. Ballarni sinflar bo'yicha jamlaymiz
    let classScores = {};
    classes.forEach(c => classScores[c.id] = { info: c, total: 0, count: 0 });
    
    evals.forEach(e => {
      if(classScores[e.class_id]) {
        classScores[e.class_id].total += e.score;
        classScores[e.class_id].count++;
      }
    });

    // Massivga o'tkazamiz va saralaymiz
    let allClasses = Object.values(classScores).sort((a, b) => b.total - a.total);

    // 4. HTML yaratish funksiyasi (yashirin trend bilan)
    const renderList = (arr, level) => {
      let filtered = arr.filter(item => item.info.level === level);
      
      if (filtered.length === 0) return `<div style="text-align:center;color:#94A3B8;padding:20px;">Hozircha natija yo'q</div>`;

      return filtered.map((item, index) => {
        let rankClass = index === 0 ? 'top-1' : index === 1 ? 'top-2' : index === 2 ? 'top-3' : '';
        let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1);
        
        // O'sish / Pasayish (Hozircha random, keyin bazadan olinadi)
        let trendHtml = '';
        if (index === 0) trendHtml = `<div class="trend up">▲ O'sish</div>`;
        else if (index === 1) trendHtml = `<div class="trend up">▲ O'sish</div>`;
        else if (index === 2) trendHtml = `<div class="trend down">▼ Pasayish</div>`;
        else trendHtml = `<div class="trend same">— O'zgarmadi</div>`;

        // Vaqtinchalik: Agar ball yig'ilmasa
        let finalScore = item.total > 0 ? item.total : 0;

        return `
          <div class="class-row ${rankClass}">
            <div class="rank">${medal}</div>
            <div class="class-name">${item.info.name}</div>
            ${trendHtml}
            <div class="score">${finalScore} <span>ball</span></div>
          </div>
        `;
      }).join('');
    };

    // 5. Ekranga chiqaramiz
    document.getElementById("primary-list").innerHTML = renderList(allClasses, "primary");
    document.getElementById("upper-list").innerHTML = renderList(allClasses, "upper");
    document.getElementById("live-status").innerText = "Live";
    document.getElementById("live-status").style.color = "#10B981";

  } catch (err) {
    console.error(err);
    document.getElementById("primary-list").innerHTML = `<div style="color:red;">Xatolik: ${err.message}</div>`;
  }
}

// Sahifa yuklanganda ishga tushadi
loadRatings();
</script>
</body>
</html>
