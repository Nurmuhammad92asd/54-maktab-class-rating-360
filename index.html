<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>54-MAKTAB | Class Rating 360</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #4F46E5;      /* Binafsha-ko'k (Zamonaviy) */
  --primary-hover: #4338CA;
  --bg: #F3F4F6;
  --card-bg: #FFFFFF;
  --text: #111827;
  --text-muted: #6B7280;
  --border: #E5E7EB;
  --gold: #F59E0B;
  --silver: #9CA3AF;
  --bronze: #D97706;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

/* --- HEADER --- */
header {
  background: linear-gradient(135deg, #1E1B4B, #4F46E5);
  color: white;
  text-align: center;
  padding: 60px 20px 70px;
  border-bottom-left-radius: 40px;
  border-bottom-right-radius: 40px;
  box-shadow: 0 10px 30px rgba(79, 70, 229, 0.2);
  position: relative;
  overflow: hidden;
}

header::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
  animation: rotate 20s linear infinite;
}
@keyframes rotate { 100% { transform: rotate(360deg); } }

header h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; position: relative; z-index: 1;}
header p { font-size: 16px; opacity: 0.9; margin-bottom: 25px; position: relative; z-index: 1;}

.login-btn {
  display: inline-block;
  background: white;
  color: var(--primary);
  padding: 14px 35px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 700;
  font-size: 16px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
  transition: all 0.3s;
  position: relative;
  z-index: 1;
}
.login-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }

main {
  max-width: 1000px;
  margin: -30px auto 50px;
  padding: 0 15px;
  position: relative;
  z-index: 10;
}

/* --- HAFTA TANLASH --- */
.week-panel {
  background: var(--card-bg);
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  border: 1px solid var(--border);
  margin-bottom: 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 15px;
}

.week-panel label { font-weight: 700; font-size: 18px; color: var(--text); }
.week-panel select {
  padding: 12px 20px;
  border-radius: 12px;
  border: 2px solid var(--border);
  font-size: 16px;
  font-family: inherit;
  font-weight: 600;
  color: var(--primary);
  background: #EEF2FF;
  cursor: pointer;
  outline: none;
  transition: border 0.2s;
}
.week-panel select:focus { border-color: var(--primary); }

/* --- SHOHSUPA --- */
.podium-section {
  background: var(--card-bg);
  border-radius: 24px;
  padding: 30px 20px;
  margin-bottom: 30px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  border: 1px solid var(--border);
  text-align: center;
}

.section-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.podium-container {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
  height: 230px;
}

.podium-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 30%;
  max-width: 160px;
}

.podium-name { font-weight: 800; font-size: 18px; margin-bottom: 5px; color: var(--text); }
.podium-score { font-weight: 600; font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }

.podium-block {
  width: 100%;
  border-radius: 16px 16px 0 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 15px;
  color: white;
  font-size: 32px;
  box-shadow: inset 0 4px 0 rgba(255,255,255,0.3);
}

.podium-1 .podium-block { height: 160px; background: linear-gradient(180deg, #FCD34D, #F59E0B); }
.podium-2 .podium-block { height: 120px; background: linear-gradient(180deg, #CBD5E1, #94A3B8); }
.podium-3 .podium-block { height: 90px; background: linear-gradient(180deg, #D97706, #B45309); }

/* Qolgan sinflar */
.class-row {
  display: flex;
  align-items: center;
  padding: 15px 20px;
  border-radius: 16px;
  margin-bottom: 10px;
  background: #F9FAFB;
  border: 1px solid var(--border);
  transition: transform 0.2s, background 0.2s;
}
.class-row:hover { transform: translateX(5px); background: #EEF2FF; border-color: #C7D2FE; }

.rank { font-size: 18px; font-weight: 800; color: var(--text-muted); width: 40px; text-align: left; }
.class-name { flex-grow: 1; font-size: 17px; font-weight: 700; text-align: left;}
.score { font-size: 18px; font-weight: 800; color: var(--primary); }

/* --- MEZONLAR VA HAKAMLAR --- */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 40px;
}

.info-card {
  background: var(--card-bg);
  border-radius: 24px;
  padding: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  border: 1px solid var(--border);
}

.info-card h3 {
  font-size: 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--primary);
  border-bottom: 2px solid #EEF2FF;
  padding-bottom: 10px;
}

.criteria-list { list-style: none; }
.criteria-list li {
  padding: 12px 0;
  border-bottom: 1px dashed var(--border);
  display: flex;
  justify-content: space-between;
  font-weight: 600;
  font-size: 15px;
}
.criteria-list li:last-child { border: none; }
.criteria-list li span { color: var(--primary); background: #EEF2FF; padding: 2px 10px; border-radius: 10px; font-size: 13px; }

.judge-list { display: flex; flex-direction: column; gap: 15px; }
.judge-item {
  display: flex;
  align-items: center;
  gap: 15px;
  background: #F9FAFB;
  padding: 15px;
  border-radius: 16px;
  border: 1px solid var(--border);
}
.judge-avatar {
  width: 45px; height: 45px;
  background: linear-gradient(135deg, var(--primary), #818CF8);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 18px;
}
.judge-info h4 { font-size: 16px; margin: 0; color: var(--text); }
.judge-info p { font-size: 13px; margin: 0; color: var(--text-muted); }

/* Mobil moslashuv */
@media (max-width: 768px) {
  .info-grid { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
  header h1 { font-size: 24px; }
  .week-panel { flex-direction: column; text-align: center; }
  .week-panel select { width: 100%; }
  .podium-name { font-size: 14px; }
  .podium-score { font-size: 12px; }
  .podium-block { font-size: 24px; }
}
</style>
</head>
<body>

<header>
  <h1>🏆 54-MAKTAB CLASS RATING 360</h1>
  <p>Har haftalik g'oliblar, adolatli baholash va shaffof natijalar</p>
  <a href="login.html" class="login-btn">🔐 Tizimga kirish</a>
</header>

<main>
  <!-- Haftani tanlash -->
  <div class="week-panel">
    <label>📅 Haftalik natijalar:</label>
    <select id="weekSelect">
      <option value="">Yuklanmoqda...</option>
    </select>
  </div>

  <!-- BOSHLANG'ICH SINFALAR SHOHSUPASI -->
  <div class="podium-section">
    <div class="section-title">🥇 Boshlang'ich sinflar g'oliblari</div>
    <div id="primaryPodium" class="podium-container"></div>
    <div id="primaryList" style="margin-top: 30px;"></div>
  </div>

  <!-- YUQORI SINFALAR SHOHSUPASI -->
  <div class="podium-section">
    <div class="section-title">🏆 Yuqori sinflar g'oliblari</div>
    <div id="upperPodium" class="podium-container"></div>
    <div id="upperList" style="margin-top: 30px;"></div>
  </div>

  <!-- MEZONLAR VA HAKAMLAR (TANISHTIRUV) -->
  <div class="info-grid">
    
    <!-- Mezonlar -->
    <div class="info-card">
      <h3>📋 Baholash mezonlari</h3>
      <ul class="criteria-list" id="criteriaList">
        <li>Yuklanmoqda...</li>
      </ul>
    </div>

    <!-- Hakamlar -->
    <div class="info-card">
      <h3>⚖️ Mas'ul hakamlar (Xodimlar)</h3>
      <div class="judge-list" id="judgesList">
        <p style="color:var(--text-muted);">Yuklanmoqda...</p>
      </div>
    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<script>
let allClasses = [];
let allWeeks = [];
let allEvals = [];

async function initData() {
  // Barcha kerakli ma'lumotlarni parallel yuklaymiz
  const [clsRes, wkRes, evRes, critRes, staffCritRes] = await Promise.all([
    supabaseClient.from("classes").select("*"),
    supabaseClient.from("weeks").select("*").order("start_date", { ascending: false }),
    supabaseClient.from("evaluations").select("*"),
    supabaseClient.from("criteria").select("*"),
    supabaseClient.from("staff_criteria").select("staff(full_name), criteria(name)")
  ]);

  allClasses = clsRes.data || [];
  allWeeks = wkRes.data || [];
  allEvals = evRes.data || [];
  const criteria = critRes.data || [];
  const staffCriteria = staffCritRes.data || [];

  // Haftalarni select'ga yuklash
  const weekSelect = document.getElementById("weekSelect");
  weekSelect.innerHTML = allWeeks.map((w, i) => 
    `<option value="${w.id}" ${i === 0 ? 'selected' : ''}>${w.title} (${w.start_date} - ${w.end_date})</option>`
  ).join("");

  weekSelect.addEventListener("change", () => renderWeek(weekSelect.value));

  // Mezonlarni chiqarish
  document.getElementById("criteriaList").innerHTML = criteria.map(c => 
    `<li>${c.name} <span>${c.max_score} ball</span></li>`
  ).join("");

  // Hakamlarni chiqarish
  const judgesDiv = document.getElementById("judgesList");
  if (staffCriteria.length > 0) {
    judgesDiv.innerHTML = staffCriteria.map(sc => {
      const name = sc.staff?.full_name || "Noma'lum";
      const initial = name.charAt(0).toUpperCase();
      const critName = sc.criteria?.name || "Mezon yo'q";
      return `
        <div class="judge-item">
          <div class="judge-avatar">${initial}</div>
          <div class="judge-info">
            <h4>${name}</h4>
            <p>${critName}</p>
          </div>
        </div>
      `;
    }).join("");
  } else {
    judgesDiv.innerHTML = `<p style="color:var(--text-muted);">Hakamlar biriktirilmagan.</p>`;
  }

  // Reytingni chizish
  if (allWeeks.length > 0) {
    renderWeek(allWeeks[0].id);
  }
}

function renderWeek(selectedWeekId) {
  const selectedWeekIndex = allWeeks.findIndex(w => w.id == selectedWeekId);
  const prevWeekId = selectedWeekIndex < allWeeks.length - 1 ? allWeeks[selectedWeekIndex + 1].id : null;

  let classStats = {};
  allClasses.forEach(c => classStats[c.id] = { info: c, current: 0, prev: 0 });

  allEvals.forEach(e => {
    if (!classStats[e.class_id]) return;
    if (e.week_id == selectedWeekId) classStats[e.class_id].current += Number(e.score);
    if (e.week_id == prevWeekId) classStats[e.class_id].prev += Number(e.score);
  });

  let sorted = Object.values(classStats).sort((a, b) => b.current - a.current);

  drawPodium(sorted, "primary", "primaryPodium", "primaryList");
  drawPodium(sorted, "upper", "upperPodium", "upperList");
}

function drawPodium(sortedData, level, podiumId, listId) {
  let filtered = sortedData.filter(item => item.info.level === level);
  const podiumDiv = document.getElementById(podiumId);
  const listDiv = document.getElementById(listId);

  if (filtered.length === 0 || filtered[0].current === 0) {
    podiumDiv.innerHTML = `<p style="color:#9CA3AF; width:100%;">Bu hafta uchun natijalar hali yo'q</p>`;
    listDiv.innerHTML = "";
    return;
  }

  let top3 = filtered.filter(f => f.current > 0).slice(0, 3);
  let rest = filtered.slice(top3.length);

  let p1 = top3[0] ? `<div class="podium-item podium-1"><div class="podium-name">${top3[0].info.name}</div><div class="podium-score">${top3[0].current} ball</div><div class="podium-block">🥇</div></div>` : '';
  let p2 = top3[1] ? `<div class="podium-item podium-2"><div class="podium-name">${top3[1].info.name}</div><div class="podium-score">${top3[1].current} ball</div><div class="podium-block">🥈</div></div>` : '';
  let p3 = top3[2] ? `<div class="podium-item podium-3"><div class="podium-name">${top3[2].info.name}</div><div class="podium-score">${top3[2].current} ball</div><div class="podium-block">🥉</div></div>` : '';

  podiumDiv.innerHTML = p2 + p1 + p3;

  listDiv.innerHTML = rest.map((item, index) => {
    let rank = index + top3.length + 1;
    let diff = item.current - item.prev;
    let diffHtml = '';
    
    if (item.prev > 0) {
      if (diff > 0) diffHtml = `<span style="color:#10B981;font-size:13px;font-weight:bold;margin-left:10px;">▲ +${diff}</span>`;
      else if (diff < 0) diffHtml = `<span style="color:#EF4444;font-size:13px;font-weight:bold;margin-left:10px;">▼ ${diff}</span>`;
      else diffHtml = `<span style="color:#6B7280;font-size:13px;font-weight:bold;margin-left:10px;">—</span>`;
    }

    return `
      <div class="class-row">
        <div class="rank">${rank}</div>
        <div class="class-name">${item.info.name} ${diffHtml}</div>
        <div class="score">${item.current} ball</div>
      </div>
    `;
  }).join('');
}

initData();
</script>
</body>
</html>
